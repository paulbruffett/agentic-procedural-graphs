[project]
name = "procedural-graphs"
version = "0.1.0"
description = "Lightweight reference implementation of Procedural Graphs (arXiv 2609.09153) on LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    "langchain-core>=1.6,<2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "datasets>=3.0",
]

[project.scripts]
pg = "pg.cli:main"

[project.optional-dependencies]
wandb = [
    "wandb>=0.30.0",
]
enterprisearena = [
    "openpyxl>=3.1",
    "pandas>=2",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
